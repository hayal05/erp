# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Keep the repository root: backend migrations live in database/ beside backend/.
# ONE service, ONE URL: the Node API also serves the built React app (frontend/dist), so the browser
# talks to a single origin (same-origin cookies, no CORS, no cross-site cookie problems).
services:
  - type: web
    name: natra-erp
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    # Frontend deps include devDependencies (Vite). VITE_API_URL is intentionally NOT set: empty = same origin.
    buildCommand: >-
      npm --prefix backend ci --omit=dev && npm --prefix backend run build &&
      npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: >-
      DATABASE_URL="$MIGRATION_DATABASE_URL" node backend/src/db/migrate.js && node backend/src/server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - database/**
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # FRONTEND_URL is not needed: the API defaults it to Render's RENDER_EXTERNAL_URL (this service's own
      # origin). Add FRONTEND_URL only if users reach the app through a custom domain.
      - key: COOKIE_SAMESITE
        value: lax
      - key: COMPANY_NAME
        value: Natra
      - key: COMPANY_TIMEZONE
        value: Africa/Addis_Ababa
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
