# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Keep the repository root: backend migrations live in database/ beside backend/.
services:
  - type: web
    name: natra-erp-api
    runtime: node
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix backend run build
    startCommand: >-
      DATABASE_URL="$MIGRATION_DATABASE_URL" node backend/src/db/migrate.js && node backend/src/server.js
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - database/**
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: COMPANY_NAME
        value: Natra
      - key: COMPANY_TIMEZONE
        value: Africa/Addis_Ababa
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: natra-erp-web
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          name: natra-erp-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
